name: Manter Supabase ativo

# O plano gratuito do Supabase pausa projetos sem atividade durante 7 dias.
# Isto faz um pedido leve de 3 em 3 dias. Requer os secrets do repositório
# SUPABASE_URL e SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions).
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "Secrets não configurados — nada a fazer."; exit 0; fi
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}'
